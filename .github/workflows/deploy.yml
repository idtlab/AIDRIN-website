# Build the static site in CI and publish it to GitHub Pages.
#
# One-time setup (Settings → Pages):
#   Source: "GitHub Actions"
#   Custom domain: aidrin.org  (also committed as public/CNAME)
#
# DNS for the apex domain must point at GitHub Pages:
#   A    aidrin.org  185.199.108.153
#   A    aidrin.org  185.199.109.153
#   A    aidrin.org  185.199.110.153
#   A    aidrin.org  185.199.111.153
#   CNAME www        idtlab.github.io
# Once the certificate is issued, tick "Enforce HTTPS".

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}        # allow manual runs from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate the deploy on type/schema checks and a build. (Add e2e here if desired.)
      - run: npm run check
      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
