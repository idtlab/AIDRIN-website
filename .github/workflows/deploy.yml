# Build the static site in CI and deploy it to an EC2 instance over SSH (rsync).
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY   private SSH key (e.g. an ed25519 deploy key) authorized on the instance
#   DEPLOY_HOST      instance hostname or public IP (e.g. aidrin.org or 1.2.3.4)
#   DEPLOY_USER      SSH user (e.g. ubuntu or ec2-user)
#
# Set DEPLOY_PATH below to the web root the instance serves (nginx example):
#   server { listen 80; root /var/www/aidrin-landing; try_files $uri $uri/ =404; }
# The deploy user must be able to write to DEPLOY_PATH (chown it to DEPLOY_USER,
# or deploy to a staging dir and have a hook move it).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}        # allow manual runs from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  DEPLOY_PATH: /var/www/aidrin-website   # <-- web root on the instance

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Gate the deploy on type/schema checks and a build. (Add e2e here if desired.)
      - run: npm run check
      - run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy dist/ to the instance
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${DEPLOY_PATH}/"
